[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentclip"
version = "0.1.0"
description = "Use any web-chat LLM as a coding agent over the clipboard"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "copykitten>=2.0,<3",
    "pyperclip>=1.11,<2",
    "platformdirs>=4",
    "tomli-w>=1.2.0",
    "pillow>=11,<12",
    # The SSH host (hosts/ssh.py): one persistent connection, exec channels and
    # SFTP in one synchronous library. Imported lazily, so a local session never
    # pays for it (docs/design/remote-ssh.md decision 7).
    "paramiko>=3.4,<4",
    # The X11 backend (driver/screen/x11.py): capture, XTest input and EWMH
    # focus on Linux, so `agentclip-monitor` works on the VM it was designed to
    # run on. A CORE dependency rather than an extra, under a platform marker:
    # the monitor is expected to run there with no extras at all, and on
    # Windows/macOS the marker means it is never even resolved. Imported lazily
    # inside functions, like every other OS binding in that layer.
    "python-xlib>=0.33; sys_platform == 'linux'",
    # The monitor's interface list (driver/monitor/interfaces.py): which
    # addresses this machine can be dialled on, shown to the operator who has to
    # carry one to the other machine. A CORE dependency for the same reason as
    # python-xlib - the monitor is expected to run on a bare VM with no extras -
    # and imported lazily inside the one function that uses it, so a build that
    # somehow lost it still polls, serves and clicks.
    "psutil>=5.9",
]

[project.optional-dependencies]
# The OpenCV matcher backend (screen.matchers), opt in per service in the
# service editor's MATCHING block. Deliberately NOT a runtime dependency: it is
# ~60MB of compiled wheels against a project that ships as a PyInstaller
# one-file build, and the built-in anchor search needs nothing at all. Both are
# imported lazily inside functions and the backend falls back to anchors when
# they are absent, so an install without this extra is fully functional.
cv = [
    "opencv-python-headless>=4.10",
    "numpy>=2",
]
mcp = [
    "mcp>=2,<3",
]
# The Chat UI (agentclip.shell.chat): a native window rendering the packaged
# HTML/CSS/JS frontend through the WebView2 runtime Windows already ships
# (docs/design/gui.md section 2). An extra rather than a runtime dependency for
# the same reason as the others: the halves that never open a window - the
# engine on an SSH target, the standing monitor on the VM - must not pay for
# one, so `agentclip.shell.chat.shell` imports pywebview lazily inside its
# functions and cli.py only reaches for the package when it opens the window.
gui = [
    "pywebview>=5.3,<6",
]

[project.scripts]
agentclip = "agentclip.cli:main"
# The engine half, as a named executable. A remote session is deployed by
# installing this same package on the SSH target (uv tool install / pipx / pip);
# the master then launches `agentclip-engine` by name over an exec channel and
# speaks the JSON-lines wire over its stdio (docs/design/remote-executor.md
# section 2.6). Nothing is pushed to the target at connect time.
agentclip-engine = "agentclip.engine.link.__main__:main"
# The MONITOR half, as a named executable (docs/design/ui-monitor.md 6.5). It
# runs on the machine whose SCREEN shows the chat - a VM, or this PC in split
# mode - and serves that screen, mouse, keyboard and clipboard to a brain over
# the JSON-lines monitor wire. A standing process: it keeps polling whether or
# not a brain is attached, and accepts a redial (2.8).
# It points at the SHELL rather than at the driver since 9.1: the binary opens
# the Monitor UI (service editor, ELEMENTS, region picker, Serve panel), and
# `--headless` delegates to driver/monitor/__main__.py verbatim for the VM with
# no desktop. The argument grammar is still the Driver's, imported by that
# dispatcher - one parser, two doors.
agentclip-monitor = "agentclip.shell.monitor_ui.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "ruff",
    "mypy",
    "mcp>=2,<3",
    "pywebview>=5.3,<6",
]
build = [
    "pyinstaller>=6.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentclip"]

# The user guide, which the Chat UI's "docs" button renders (shell/chat/docs.py reads
# it, app.js renders it). The files live at the repo root - they are documents
# first and package data second - so a wheel would otherwise ship an app whose
# help button has nothing to open. Copied to `agentclip/docs`, where
# ``files("agentclip") / "docs"`` looks; packaging/agentclip.spec puts them at
# the same path for the frozen exe. A source checkout needs neither: the reader
# walks up to the repo's own docs/ when the package carries none.
[tool.hatch.build.targets.wheel.force-include]
"docs/commands.md" = "agentclip/docs/commands.md"
"docs/configuration.md" = "agentclip/docs/configuration.md"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "real_os: exercises real OS input/clipboard/screen APIs; opt in with AGENTCLIP_OS_TESTS=1",
    "real_ssh: talks to a real remote machine; opt in with AGENTCLIP_SSH_TESTS=1 + AGENTCLIP_SSH_TARGET",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "SIM108"]

[tool.mypy]
python_version = "3.11"
strict = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
mypy_path = "src"

# The optional cv extra's stubs are not checked: numpy's bundled .pyi files use
# `type` statements, which are 3.12 syntax, and this project type-checks at its
# real floor of 3.11. Skipping them costs nothing here - both packages are
# imported inside functions in exactly one module (screen.matchers), which
# guards every use with its own try/except.
# Paramiko ships no type information (no py.typed, no stubs), so its names are
# Any here. Only hosts/ssh.py imports it, and that module's own signatures are
# annotated - what is untyped is the library surface, not our use of it.
[[tool.mypy.overrides]]
module = ["paramiko", "paramiko.*"]
ignore_missing_imports = true

# python-xlib ships no py.typed either (its stubs live in a separate
# types-python-xlib package that only makes sense on Linux). Only
# driver/screen/x11.py imports it, inside functions, and that module's own
# signatures are annotated - what is untyped is the library surface.
[[tool.mypy.overrides]]
module = ["Xlib", "Xlib.*"]
ignore_missing_imports = true

# psutil ships no py.typed (its stubs are a separate types-psutil package). Only
# driver/monitor/interfaces.py imports it, inside the one function that calls
# `net_if_addrs`, and that module's own signatures are annotated - what is
# untyped is the library surface, not our use of it.
[[tool.mypy.overrides]]
module = ["psutil", "psutil.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["cv2", "cv2.*", "numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
ignore_errors = true
ignore_missing_imports = true

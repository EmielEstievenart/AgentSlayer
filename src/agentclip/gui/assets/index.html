<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Loaded from a file:// URL by agentclip.gui.shell. Everything is local and
      self-contained: no CDN, no fonts, no network of any kind. app.js is a
      classic script rather than an ES module because a file:// origin cannot
      load module scripts (docs/design/gui.md section 2).
    -->
    <title>AgentClip</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <div class="shell">
      <header class="titlebar">
        <span class="mark">AgentClip</span>
        <span class="pill" id="state">no session</span>
        <span class="spacer"></span>
        <span class="version" id="version"></span>
      </header>

      <main class="transcript" id="transcript">
        <p class="empty">The transcript appears here once the bridge lands.</p>
      </main>

      <footer class="composer">
        <textarea
          id="composer"
          rows="3"
          disabled
          placeholder="GUI shell slice 1 &mdash; bridge lands next"
        ></textarea>
        <button id="send" type="button" disabled>Send</button>
      </footer>
    </div>
    <script src="app.js" defer></script>
  </body>
</html>
